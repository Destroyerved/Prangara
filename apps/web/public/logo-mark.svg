<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 149 143" fill="none">
  <style>
    .logo-dark { display: none; }
    .logo-light { display: block; }
    :root[data-theme="light"] .logo-light { display: none; }
    :root[data-theme="light"] .logo-dark { display: block; }
  </style>
  <image href="data:image/png;base64," width="149" height="143" class="logo-light" />
  <image href="data:image/png;base64," width="149" height="143" class="logo-dark" />
</svg>